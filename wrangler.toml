name = "val"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The app answers on the apex. A Custom Domain rather than a route pattern so
# Cloudflare issues and renews the certificate itself — the uid cookie is
# Secure, so over plain http the browser never stores it and sign-in silently
# never completes.
routes = [{ pattern = "valoox.store", custom_domain = true }]

# Off, and said out loud rather than left to the default. One address for one
# app: a second hostname serving the same Worker is a second place the uid
# cookie can be set and a second origin to reason about in the CSP.
workers_dev = false
preview_urls = false

# Load-bearing for the privacy claim: Workers Logs defaults to ON for new Workers
# and persists method + URL for 3 days. The storefront path carries the puuid.
[observability]
enabled = false

# The daily store rotates at 00:00 UTC. Half an hour later is early enough to be
# useful and late enough that Riot has settled — and off-the-hour on purpose,
# because firing at :00 alongside everyone else is the shape that gets throttled.
# 00:30 UTC is 19:30 in Colombia: a reasonable hour to be told something.
[triggers]
crons = ["30 0 * * *"]

# Printed on every message, so it is a var and not a secret. It has to be an
# address on a domain verified in Resend — the subdomain keeps the sending
# reputation off valoox.store, which can then hold a strict DMARC of its own.
# The apex, once valoox.store is a zone on this account. A Custom Domain
# rather than a route pattern so Cloudflare issues and renews the certificate
# itself — the uid cookie is Secure, so without HTTPS sign-in silently never
# completes. Commented rather than deleted because the only thing missing is
# the nameserver change: uncomment it and deploy.
# routes = [{ pattern = "valoox.store", custom_domain = true }]

# Off, and said out loud rather than left to the default. One address for one
# app: a second hostname serving the same Worker is a second place the uid
# cookie can be set and a second origin to reason about in the CSP.
workers_dev = false
preview_urls = false

[vars]
MAIL_FROM = "valoox <alerts@mail.valoox.store>"

[assets]
directory = "./public"
# Named so the Worker can hand back the shell itself. Every path that is not
# /api/* is an app route — /offer/<uuid> is a real, linkable URL — and without
# this a reload or a shared link falls through to the Worker's 404 instead of
# the page that knows what to do with it.
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "val-sessions"
database_id = "564cac83-d7b7-4c0c-ab08-705a2b5f6549"

[[kv_namespaces]]
binding = "VAL"
id = "ecad056b1aa948c1af81ffd82ab9d5e3"
