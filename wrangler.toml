# The default environment is the portable one: no domains, a workers.dev
# address, and a different Worker name so a stray `npm run deploy` here can
# never be mistaken for the deployed site. `npm run deploy:live` is that one.
name = "valoox"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Everything above and below this line is what ANY copy of this repository
# needs. The two custom domains are not that — they are one account's — and a
# deploy that names a zone the account does not hold fails on the last step.
# So they live in [env.live] at the bottom, which is what `npm run deploy`
# targets, and the default environment is the portable one a fork gets.
#
# A fork answers on <worker>.<subdomain>.workers.dev. That is deliberate: it
# is reachable the moment it deploys, with a certificate, which the `Secure`
# uid cookie requires.
workers_dev = true

# Load-bearing for the privacy claim: Workers Logs defaults to ON for new Workers
# and persists method + URL for 3 days. The storefront path carries the puuid.
[observability]
enabled = false

# The daily store rotates at 00:00 UTC. Half an hour later is early enough to be
# useful and late enough that Riot has settled — and off-the-hour on purpose,
# because firing at :00 alongside everyone else is the shape that gets throttled.
# 00:30 UTC is 19:30 in Colombia: a reasonable hour to be told something.
[triggers]
crons = ["30 0 * * *"]

# Printed on every message, so it is a var and not a secret. It has to be an
# address on a domain verified in Resend — the subdomain keeps the sending
# reputation off valoox.store, which can then hold a strict DMARC of its own.
[vars]
MAIL_FROM = "valoox <alerts@mail.valoox.store>"

[assets]
directory = "./public"
# Named so the Worker can hand back the shell itself. Every path that is not
# /api/* is an app route — /offer/<uuid> is a real, linkable URL — and without
# this a reload or a shared link falls through to the Worker's 404 instead of
# the page that knows what to do with it.
binding = "ASSETS"

# Pages reach the Worker first; files do not.
#
# Without this the asset layer answers before any code runs, and the apex
# served the app at / instead of pointing at it — every other path redirected
# and the front page did not, which is the worst shape that bug could take.
#
# The exclusions are the files themselves, so a bundle, a font or a sticker is
# still handed straight off the edge with no invocation behind it. It also
# means artwork keeps working on the apex, which is what the links in every
# message sent before today point at.
run_worker_first = [
  "/*",
  "!/app.js",
  "!/app.css",
  "!/art/*",
  "!/brand/*",
  "!/fonts/*",
  "!/.well-known/*",
]

# The ids here are this account's, and a Deploy to Cloudflare button replaces
# them with the ones it provisions for whoever pressed it — Cloudflare's own
# instruction is that a repository behind a button ships default values for
# every binding, so they stay.
[[d1_databases]]
binding = "DB"
database_name = "val-sessions"
database_id = "564cac83-d7b7-4c0c-ab08-705a2b5f6549"

[[kv_namespaces]]
binding = "VAL"
id = "ecad056b1aa948c1af81ffd82ab9d5e3"

# --- the deployed one ------------------------------------------------------
#
# `npm run deploy` is `wrangler deploy --env live`. The name is pinned so the
# environment does not append itself to it: this has to stay the Worker called
# `val`, which is the one the two domains are attached to.
#
# Bindings are repeated rather than inherited because wrangler does not
# inherit them — vars, d1_databases and kv_namespaces are per-environment by
# design, and a named environment that omits them deploys with none.
[env.live]
name = "val"

# The app answers on drop.valoox.store, and the apex answers only to point at
# it — see the signpost in src/router.ts. Two hosts on purpose: the landing
# page is read by somebody deciding whether to sign in, the app holds a Riot
# session, and keeping them apart scopes the uid cookie to the app alone.
#
# Custom Domains rather than route patterns so Cloudflare issues and renews
# the certificates itself — the uid cookie is Secure, so over plain http the
# browser never stores it and sign-in silently never completes.
routes = [
  { pattern = "drop.valoox.store", custom_domain = true },
  { pattern = "valoox.store", custom_domain = true },
]

# Off, and said out loud rather than left to the default. Every hostname that
# serves this Worker is a place the uid cookie can be set and an origin to
# reason about in the CSP, so the list above is the whole list.
workers_dev = false
preview_urls = false

[env.live.vars]
MAIL_FROM = "valoox <alerts@mail.valoox.store>"

[[env.live.d1_databases]]
binding = "DB"
database_name = "val-sessions"
database_id = "564cac83-d7b7-4c0c-ab08-705a2b5f6549"

[[env.live.kv_namespaces]]
binding = "VAL"
id = "ecad056b1aa948c1af81ffd82ab9d5e3"
