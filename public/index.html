<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- `interactive-widget=resizes-content` is the half that is not obvious.
         Without it the on-screen keyboard leaves the LAYOUT viewport the size
         of the whole screen and only shrinks the visual one — so `100dvh` and
         a `position: fixed; bottom: 0` bar are both measured against a screen
         the keyboard is covering, and the bar sits underneath it, repainting
         in the wrong place on every scroll. With it, the layout viewport is
         what is actually visible and both are simply correct. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>valoox</title>
    <meta
      name="description"
      content="Tu tienda diaria y tu colección de VALORANT desde el celular, sin abrir el juego."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0e11" />

    <!-- The mark, in the tab. SVG first because it is two circles and stays
         two circles at any size; the PNG is what Safari and every mail client
         can actually read, and it is the same file the messages carry.
         Both are ours and both are generated — see scripts/mark.mjs. -->
    <link rel="icon" href="/brand/mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/mark.png" sizes="66x66" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/mark.png" />
    <meta name="referrer" content="no-referrer" />

    <!--
      Both faces, ahead of the stylesheet that asks for them. They are the only
      two files on the critical path that are not generated, and a swap on the
      first paint of a screen whose whole job is to be quick is exactly the
      flicker worth one line each to avoid.
    -->
    <link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/azeret.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/app.css" />
  </head>

  <body>
    <!--
      Empty on purpose. The DOM is built in web/, never from a string: item
      names come from a community database this project does not control, and
      innerHTML with those is stored XSS with extra steps. test/unit/seams.test.ts
      fails the build if one appears.
    -->
    <div id="app"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
