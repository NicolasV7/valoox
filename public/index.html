<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>valoox</title>
    <meta
      name="description"
      content="Tu tienda diaria y tu colección de VALORANT desde el celular, sin abrir el juego."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e0e11" />
    <meta name="referrer" content="no-referrer" />

    <!--
      Both faces, ahead of the stylesheet that asks for them. They are the only
      two files on the critical path that are not generated, and a swap on the
      first paint of a screen whose whole job is to be quick is exactly the
      flicker worth one line each to avoid.
    -->
    <link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/azeret.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/app.css" />
  </head>

  <body>
    <!--
      Empty on purpose. The DOM is built in web/, never from a string: item
      names come from a community database this project does not control, and
      innerHTML with those is stored XSS with extra steps. test/unit/seams.test.ts
      fails the build if one appears.
    -->
    <div id="app"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
