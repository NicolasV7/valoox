name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Types are generated from wrangler.toml, so they are never stale here.
      - run: npx wrangler types
      - run: npx tsc --noEmit
      - run: npx biome ci .
      # Runs both projects: pure modules in Node, and the storage layer inside
      # real workerd against real local D1.
      - run: npx vitest run
